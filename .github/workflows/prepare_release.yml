# Run MATLAB tests across multiple MATLAB versions and create a draft release

name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number in major.minor.patch format, i.e 2.8.0'
        required: true
        type: string

jobs:
  validate_version:
    runs-on: ubuntu-latest
    steps:
      - name: Check version format
        run: |
          version="${{ github.event.inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Input for 'version' ('$version') is not in the expected major.minor.patch format."
            exit 1
          fi
          echo "Version '$version' is valid."

  set_matrix:
    name: Set test matrix
    runs-on: ubuntu-latest
    needs: [validate_version]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      releases: ${{ steps.set-matrix.outputs.releases }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set matrix
        id: set-matrix
        run: |
          config=.github/workflows/configurations/matlab_release_matrix_strategy.yml

          # One job per MATLAB release and platform. The macOS runner is
          # release-specific, so the combinations are listed explicitly instead
          # of being generated as a cross product of `os` and `matlab-version`.
          matrix=$(yq -o=json '{
              "include": [
                .[] as $release
                  | ["windows-latest", "ubuntu-latest", $release.macos-runner]
                  | .[] as $os
                  | ($release * {"os": $os} | del(.macos-runner))
              ]
            }' "$config" | tr -d '\n')

          # Release list for the 'tested with' badge, e.g. "R2021a | R2021b"
          releases=$(yq '[.[].matlab-version] | join(" | ")' "$config")

          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "releases=$releases" >> $GITHUB_OUTPUT

  run_tests:
    name: Run MATLAB tests (${{ matrix.matlab-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [validate_version, set_matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set_matrix.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install python dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          pip install -r +tests/requirements.txt
          # Install pynwb and nwbinspector only for Python 3.10+ (both dropped Python 3.9 support).
          # Release tests use the same pinned releases as run_tests.yml; dev-branch
          # compatibility is covered separately by run_pynwb_dev_tests.yml.
          if [[ "${{ matrix.skip-pynwb-tests }}" == "0" ]]; then
            pip install -r +tests/requirements-python310.txt
          fi
          python -m pip list

      - name: Configure python env (macOS, ubuntu)
        if: runner.os != 'Windows'
        run: |
          echo "HDF5_PLUGIN_PATH=$(python -c "import hdf5plugin; print(hdf5plugin.PLUGINS_PATH)")" >> "$GITHUB_ENV"

      - name: Configure python env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pluginPath = python -c "import hdf5plugin; print(hdf5plugin.PLUGINS_PATH)"
          Add-Content -Path $env:GITHUB_ENV -Value "HDF5_PLUGIN_PATH=$pluginPath"

      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.matlab-version }}

      - name: Run tests
        uses: matlab-actions/run-command@v3
        env:
          HDF5_PLUGIN_PATH: ${{ env.HDF5_PLUGIN_PATH }}
        with:
          command: |
            setenv("SKIP_PYNWB_TESTS", ...
                num2str(${{ matrix.skip-pynwb-tests }}))
            setenv("SKIP_NWBINSPECTOR_TEST", ...
                num2str(${{ matrix.skip-nwbinspector-test }}))
            pyenv("ExecutionMode", "OutOfProcess");
            results = assertSuccess(nwbtest('ReportOutputFolder', '.')); 
            assert(~isempty(results), 'No tests ran');

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.matlab-version }}
          path: testResults.xml

  publish_junit:
    name: Publish JUnit test results
    runs-on: ubuntu-latest
    if: always()
    needs: [run_tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Retrieve result files
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          merge-multiple: false

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '*/testResults.xml'

  update_version:
    name: Create new draft release for given version
    runs-on: ubuntu-latest
    needs: [run_tests, set_matrix]
    steps:
      - name: Checkout repository using deploy key
        uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Update Contents.m file
        run: |
          # Read the template file
          template=$(cat .github/workflows/templates/contents_header_template.txt)
          
          # Get current date in DD-MMM-YYYY format
          date_string=$(date +"%d-%b-%Y")
          
          # Get current year
          year_number=$(date +"%Y")
          
          # Replace placeholders in template
          header="${template/\{\{version_number\}\}/${{ github.event.inputs.version }}}"
          header="${header/\{\{date_string\}\}/$date_string}"
          header="${header/\{\{year_number\}\}/$year_number}"
          
          # Extract the content after the header from the current Contents.m file
          content=$(awk '/^% -{10,}/{flag=1;next} flag{print}' Contents.m)
          
          # Combine new header with existing content
          echo "$header" > Contents.m
          echo "$content" >> Contents.m

      - name: Commit updated Contents.m file
        run: |
          git config user.name "${{ github.workflow }} by ${{ github.actor }}"
          git config user.email "<>"

          # Contents.m is already at this version when a previous run pushed the
          # bump before failing later on. Skip the commit instead of failing, so
          # the workflow can be re-run after such a failure.
          if git diff --quiet -- Contents.m; then
            echo "Contents.m is already at version ${{ inputs.version }}; nothing to commit."
            exit 0
          fi

          git add Contents.m
          git commit -m "Update version number in Contents.m"

          # Let a rejected push fail the job. main having moved during the test
          # run means the release needs a human decision, not a silent retry.
          git push origin HEAD:refs/heads/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate tested with badge
        run: |
          # pybadges imports pkg_resources at load time, which setuptools no
          # longer ships as of 82.0. Python 3.12 does not bundle setuptools, so
          # it has to be installed explicitly and held below that version.
          pip install "setuptools<82" pybadges
          mkdir -p .github/badges/v${{ inputs.version }}
          python -c "
          from pybadges import badge
          with open('.github/badges/v${{ inputs.version }}/tested_with.svg', 'w') as f:
              f.write(badge(
                  left_text='tested with',
                  right_text='${{ needs.set_matrix.outputs.releases }}',
                  right_color='green'
              ))
          "

      - name: Generate NWB schema version badge
        run: |
          python .github/workflows/scripts/create_nwb_schema_version_badge.py ${{ inputs.version }}

      - name: Tag repository with version tag
        run: |
          tag="v${{ inputs.version }}"

          git config user.name "${{ github.workflow }} by ${{ github.actor }}"
          git config user.email "<>"

          git fetch --tags origin

          # A previous run may have pushed the tag before failing further down.
          # Re-use it when it already marks this commit; refuse when it marks a
          # different one, so a release is never cut against unexpected code.
          if existing=$(git rev-list -n 1 "$tag" 2>/dev/null); then
            if [[ "$existing" == "$(git rev-parse HEAD)" ]]; then
              echo "Tag $tag already points at $existing; keeping it."
              exit 0
            fi
            echo "Error: tag $tag already exists and points at $existing."
            echo "This run is releasing $(git rev-parse HEAD)."
            echo "Delete the tag or choose a new version, then re-run."
            exit 1
          fi

          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
      
      # Commit the SVG for the MATLAB releases test badge to gh-badges branch
      - name: Checkout gh-badges branch
        uses: actions/checkout@v6
        with:
          ref: gh-badges
          path: gh-badges

      - name: Push to gh-badges
        run: |
          mkdir -p gh-badges/.github/badges/v${{ inputs.version }}
          mkdir -p gh-badges/.github/badges/latest
          cp .github/badges/v${{ inputs.version }}/tested_with.svg gh-badges/.github/badges/v${{ inputs.version }}/tested_with.svg
          cp .github/badges/v${{ inputs.version }}/supported_nwb_schema.svg gh-badges/.github/badges/v${{ inputs.version }}/supported_nwb_schema.svg
          cp .github/badges/latest/supported_nwb_schema.svg gh-badges/.github/badges/latest/supported_nwb_schema.svg
          cd gh-badges

          git config user.name "${{ github.workflow }} by ${{ github.actor }}"
          git config user.email "<>"

          # Only proceed with commit and push if changes are detected
          if [[ -n "$(git status --porcelain .github/badges)" ]]; then
            git add .github/badges
            git commit -m "Update badges for release v${{ inputs.version }}"
            git push
          else
            echo "Badges are unchanged; nothing to commit"
          fi

      # Create the release
      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          tag: v${{ inputs.version }}
          generateReleaseNotes: true
          body: |
            ![Tested On Platforms](https://raw.githubusercontent.com/NeurodataWithoutBorders/matnwb/refs/heads/gh-badges/.github/badges/tested_on.svg)
            ![MATLAB Versions Tested](https://raw.githubusercontent.com/NeurodataWithoutBorders/matnwb/refs/heads/gh-badges/.github/badges/v${{ inputs.version }}/tested_with.svg)
            ![Supported NWB Schema](https://raw.githubusercontent.com/NeurodataWithoutBorders/matnwb/refs/heads/gh-badges/.github/badges/v${{ inputs.version }}/supported_nwb_schema.svg)
